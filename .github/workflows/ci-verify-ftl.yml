name: CI Verify & Firebase Test Lab Robo

on:
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-verify:
    name: Web Lint, Typecheck, Build & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install, lint, typecheck, build, and run Playwright E2E
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/web-verify.log

          echo "=== [1/5] npm ci ===" | tee -a /tmp/web-verify.log
          npm ci 2>&1 | tee -a /tmp/web-verify.log

          echo "=== [2/5] npx oxlint src server tests ===" | tee -a /tmp/web-verify.log
          npx oxlint src server tests 2>&1 | tee -a /tmp/web-verify.log

          echo "=== [3/5] npx tsc --noEmit ===" | tee -a /tmp/web-verify.log
          npx tsc --noEmit 2>&1 | tee -a /tmp/web-verify.log

          echo "=== [4/5] npm run build ===" | tee -a /tmp/web-verify.log
          npm run build 2>&1 | tee -a /tmp/web-verify.log

          echo "=== [5/5] Playwright Chromium E2E ===" | tee -a /tmp/web-verify.log
          if [[ -x "/opt/google/chrome/chrome" ]]; then
            export PLAYWRIGHT_CHROMIUM_PATH="/opt/google/chrome/chrome"
            echo "Using preinstalled Google Chrome: ${PLAYWRIGHT_CHROMIUM_PATH}" | tee -a /tmp/web-verify.log
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            export PLAYWRIGHT_CHROMIUM_PATH="$(command -v google-chrome-stable)"
            echo "Using preinstalled Google Chrome: ${PLAYWRIGHT_CHROMIUM_PATH}" | tee -a /tmp/web-verify.log
          elif command -v chromium >/dev/null 2>&1; then
            export PLAYWRIGHT_CHROMIUM_PATH="$(command -v chromium)"
            echo "Using preinstalled Chromium: ${PLAYWRIGHT_CHROMIUM_PATH}" | tee -a /tmp/web-verify.log
          else
            PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=20000 npx playwright install chromium 2>&1 | tee -a /tmp/web-verify.log
          fi
          npm run test:e2e 2>&1 | tee -a /tmp/web-verify.log

      - name: Upload web-dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Summarize web-verify failure logs
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/web-verify.log ]]; then
            tail -n 60 /tmp/web-verify.log > /tmp/web-verify-tail60.log
          else
            echo "No /tmp/web-verify.log produced (failure occurred before verification step)." > /tmp/web-verify-tail60.log
          fi

          {
            echo "## Web Verification Failure (\`web-verify\`)"
            echo ""
            echo "- **Run:** \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)"
            echo "- **Ref:** \`${GITHUB_REF}\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo ""
            echo "### Last 60 Lines of \`/tmp/web-verify.log\`"
            echo ""
            echo '```text'
            cat /tmp/web-verify-tail60.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload web-verify-logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-verify-logs
          path: /tmp/web-verify-tail60.log
          retention-days: 7

  firebase-test-lab:
    name: Android Unit Tests, Debug APK & Firebase Test Lab Robo
    needs: web-verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node dependencies
        run: npm ci

      - name: Download web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Sync Capacitor Android, run JVM unit tests & build debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          npx cap sync android
          chmod +x android/gradlew
          (
            cd android
            ./gradlew testDebugUnitTest assembleDebug --no-daemon
          )
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Check GCP OIDC repository variables for Firebase Test Lab
        id: gcp_vars
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT }}
          RESULTS_BUCKET: ${{ vars.FTL_RESULTS_BUCKET }}
          FTL_MODEL: ${{ vars.FTL_DEVICE_MODEL || 'shiba' }}
          FTL_VERSION: ${{ vars.FTL_OS_VERSION || '34' }}
        run: |
          set -euo pipefail
          if [[ -z "${WIF_PROVIDER}" && -z "${SA_EMAIL}" && -z "${RESULTS_BUCKET}" ]]; then
            echo "ftl_enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Android JVM unit tests and debug APK build succeeded. Skipping cloud Firebase Test Lab Robo step because optional GCP OIDC repository variables are not configured yet (run ./scripts/setup-gcp-github-ci.sh to enable)."
            {
              echo "## Android Verification Summary (\`firebase-test-lab\`)"
              echo ""
              echo "- **Capacitor Android Sync & JVM Unit Tests (\`testDebugUnitTest\`):** Passed"
              echo "- **Debug APK Build (\`assembleDebug\`):** Passed (\`android/app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Firebase Test Lab Cloud Robo Run:** Skipped (optional GCP OIDC variables \`GCP_WORKLOAD_IDENTITY_PROVIDER\`, \`GCP_SERVICE_ACCOUNT\`, \`FTL_RESULTS_BUCKET\` are not set on this repository; run \`./scripts/setup-gcp-github-ci.sh\` to enable cloud device runs)"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          missing=()
          if [[ -z "${WIF_PROVIDER}" ]]; then
            missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          fi
          if [[ -z "${SA_EMAIL}" ]]; then
            missing+=("GCP_SERVICE_ACCOUNT")
          fi
          if [[ -z "${RESULTS_BUCKET}" ]]; then
            missing+=("FTL_RESULTS_BUCKET")
          fi
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Incomplete GCP OIDC configuration — missing GitHub repository variables: ${missing[*]}. Run ./scripts/setup-gcp-github-ci.sh first."
            exit 1
          fi

          if [[ -n "${GCP_PROJECT_ID}" && ! "${GCP_PROJECT_ID}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]; then
            echo "::error::Invalid GCP_PROJECT_ID format."
            exit 1
          fi
          if [[ ! "${RESULTS_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]]; then
            echo "::error::Invalid FTL_RESULTS_BUCKET format."
            exit 1
          fi
          if [[ ! "${FTL_MODEL}" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo "::error::Invalid FTL_DEVICE_MODEL format."
            exit 1
          fi
          if [[ ! "${FTL_VERSION}" =~ ^[0-9]{2,3}$ ]]; then
            echo "::error::Invalid FTL_OS_VERSION format."
            exit 1
          fi
          echo "ftl_enabled=true" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to Google Cloud via Keyless OIDC
        if: steps.gcp_vars.outputs.ftl_enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: steps.gcp_vars.outputs.ftl_enabled == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab Android Robo test
        if: steps.gcp_vars.outputs.ftl_enabled == 'true'
        shell: bash
        env:
          FTL_BUCKET: ${{ vars.FTL_RESULTS_BUCKET }}
          FTL_MODEL: ${{ vars.FTL_DEVICE_MODEL || 'shiba' }}
          FTL_VERSION: ${{ vars.FTL_OS_VERSION || '34' }}
          FTL_RESULTS_DIR: ftl-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "${FTL_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]]; then
            echo "::error::Invalid FTL_RESULTS_BUCKET format."
            exit 1
          fi
          if [[ ! "${FTL_MODEL}" =~ ^[A-Za-z0-9_.-]{1,64}$ ]]; then
            echo "::error::Invalid FTL_DEVICE_MODEL format."
            exit 1
          fi
          if [[ ! "${FTL_VERSION}" =~ ^[0-9]{2,3}$ ]]; then
            echo "::error::Invalid FTL_OS_VERSION format."
            exit 1
          fi
          if [[ ! "${FTL_RESULTS_DIR}" =~ ^ftl-[0-9]+-[0-9]+$ ]]; then
            echo "::error::Invalid FTL_RESULTS_DIR format."
            exit 1
          fi

          gcloud firebase test android run \
            --type=robo \
            --app=android/app/build/outputs/apk/debug/app-debug.apk \
            --device="model=${FTL_MODEL},version=${FTL_VERSION},locale=ko,orientation=portrait" \
            --timeout=5m \
            --results-bucket="gs://${FTL_BUCKET}" \
            --results-dir="${FTL_RESULTS_DIR}"

      - name: Collect Firebase Test Lab Logcat crash & graphics diagnostics
        if: failure() && steps.gcp_vars.outputs.ftl_enabled == 'true'
        shell: bash
        env:
          FTL_BUCKET: ${{ vars.FTL_RESULTS_BUCKET }}
          FTL_DIR: ftl-${{ github.run_id }}-${{ github.run_attempt }}
          FTL_MODEL: ${{ vars.FTL_DEVICE_MODEL || 'shiba' }}
          FTL_VERSION: ${{ vars.FTL_OS_VERSION || '34' }}
        run: |
          set -euo pipefail
          CRASH_DIR="/tmp/ftl-crash-logs"
          DIAG_FILE="${CRASH_DIR}/crash-diagnostics.txt"
          PATTERN='FATAL EXCEPTION|RenderProcessGone|chromium|WebGL|mediapipe|OutOfMemoryError|SIGSEGV|ANR in'
          GCS_RESULTS_URI="gs://${FTL_BUCKET}/${FTL_DIR}"

          rm -rf "${CRASH_DIR}"
          mkdir -p "${CRASH_DIR}"

          downloaded_files=()
          if [[ "${FTL_BUCKET}" =~ ^[a-z0-9][a-z0-9._-]{1,220}[a-z0-9]$ ]] && command -v gcloud >/dev/null 2>&1; then
            mapfile -t logcat_uris < <(
              gcloud storage ls "${GCS_RESULTS_URI}/**" 2>/dev/null \
                | grep -Ei '(^|/)[^/]*logcat[^/]*$|\.log$' || true
            )
            for uri in "${logcat_uris[@]}"; do
              if [[ -z "${uri}" ]]; then
                continue
              fi
              rel_path="${uri#${GCS_RESULTS_URI}/}"
              dest_path="${CRASH_DIR}/${rel_path}"
              mkdir -p "$(dirname "${dest_path}")"
              if gcloud storage cp "${uri}" "${dest_path}" >/dev/null 2>&1; then
                downloaded_files+=("${dest_path}")
              fi
            done
          fi

          if (( ${#downloaded_files[@]} > 0 )); then
            if ! grep -E -n -C 3 "${PATTERN}" "${downloaded_files[@]}" > "${DIAG_FILE}" 2>/dev/null; then
              echo "No Logcat lines matched crash/graphics filter (${PATTERN}) across ${#downloaded_files[@]} file(s)." > "${DIAG_FILE}"
            fi
          else
            echo "No Logcat files found at ${GCS_RESULTS_URI}/ (step may have failed prior to Firebase Test Lab upload)." > "${DIAG_FILE}"
          fi

          {
            echo "## Firebase Test Lab Failure Diagnostics (\`firebase-test-lab\`)"
            echo ""
            echo "- **Device:** \`model=${FTL_MODEL},version=${FTL_VERSION},locale=ko,orientation=portrait\`"
            echo "- **GCS Results Path:** \`${GCS_RESULTS_URI}/\`"
            echo "- **Downloaded Logcat Files:** \`${#downloaded_files[@]}\`"
            echo ""
            echo "### Extracted Crash / WebGL / MediaPipe Diagnostics"
            echo ""
            echo '```text'
            head -n 300 "${DIAG_FILE}"
            total_lines="$(wc -l < "${DIAG_FILE}" | tr -d ' ')"
            if (( total_lines > 300 )); then
              echo "... (truncated at 300 of ${total_lines} lines; inspect the ftl-crash-logs artifact for full output)"
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload ftl-crash-logs artifact
        if: failure() && steps.gcp_vars.outputs.ftl_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ftl-crash-logs
          path: /tmp/ftl-crash-logs/
          retention-days: 14
