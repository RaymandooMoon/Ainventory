name: Push Email Notification

on:
  push: {}
  workflow_dispatch:
    inputs:
      test_note:
        description: '테스트 이메일에 함께 표시할 메모 (선택)'
        required: false
        default: '수동 테스트 발송 확인'
        type: string

permissions:
  contents: read

jobs:
  notify-on-push:
    name: Push Immediate Email Notification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deleted && github.event.repository.default_branch || '' }}
          fetch-depth: 2

      - name: Send immediate push notification email via Gmail SMTP
        shell: bash
        env:
          EMAIL_MODE: push_immediate
          GMAIL_USER: ${{ secrets.GMAIL_USER || vars.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL || vars.NOTIFY_TO_EMAIL }}
          DISPATCH_TEST_NOTE: ${{ inputs.test_note || '' }}
        run: python3 scripts/send-github-push-email.py --mode push_immediate
