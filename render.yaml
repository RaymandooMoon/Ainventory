services:
  - type: web
    name: ainventory-api
    runtime: docker
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /api/build-info
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://ainvtry.com,https://www.ainvtry.com,https://raymandoomoon.github.io
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ALLOW_PREVIEW_IFRAME
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: iNVTRY <newsletter@ainvtry.com>
      - key: NEWSLETTER_NOTIFY_EMAIL
        value: raymond@ainvtry.com
      - key: NEWSLETTER_WEBHOOK_URL
        sync: false
      - key: NEWSLETTER_WEBHOOK_SECRET
        sync: false
